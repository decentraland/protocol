syntax = "proto3";
package decentraland.sdk.components.common;

// Identifies which explorer panel OpenExplorerUi targets. Panels are not all fullscreen.
// EU_SETTINGS holds 0 so an unset `ui` field defaults to the least-intrusive panel.
enum ExplorerUi {
  EU_SETTINGS = 0;
  EU_MAP = 1;
  EU_BACKPACK = 2;
  EU_CAMERA_REEL = 3;
  EU_COMMUNITIES = 4;
  EU_PLACES = 5;
  EU_EVENTS = 6;
  EU_ITEM_PURCHASE = 7; // the item-purchase confirmation modal; see OpenExplorerUi for its parameters and result component
}
