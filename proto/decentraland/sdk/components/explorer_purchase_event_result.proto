syntax = "proto3";
package decentraland.sdk.components;

import "decentraland/sdk/components/common/id.proto";

option (common.ecs_component_id) = 1221;

// Grow-only value set appended to the scene root entity.
// Reports the outcome of an EU_ITEM_PURCHASE flow triggered via OpenExplorerUi.
message PBExplorerPurchaseEventResult {
  enum PurchaseResult {
    PR_UNSPECIFIED = 0;
    PR_PURCHASED = 1;   // purchase confirmed, transaction broadcast
    PR_DISMISSED = 2;   // player closed confirmation without buying
    PR_FAILED = 3;      // catch-all for any failure (coarse by design)
  }

  string urn = 1;
  PurchaseResult result = 2;
  uint32 timestamp = 3;
}